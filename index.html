<!DOCTYPE html>
<html lang="ms" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>MyGram</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#2196f3"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"/>

<!-- Firebase SDK -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-firestore-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-storage-compat.min.js"></script>

<style>
/* ── TOKENS ──────────────────────────────────────────────────── */
:root {
  --bg: #f4f4f4;
  --surface: #ffffff;
  --sidebar-bg: #ffffff;
  --chat-bg: #dfe4ea;
  --bubble-out: #d0eafb;
  --bubble-in: #ffffff;
  --accent: #2196f3;
  --accent2: #0d8ae8;
  --fg: #1a1a1a;
  --fg2: #555;
  --fg3: #999;
  --border: #e0e0e0;
  --hover: #f0f4f8;
  --shadow: 0 1px 4px rgba(0,0,0,.12);
  --radius: 18px;
  --radius-sm: 8px;
  --online: #4caf50;
  --danger: #f44336;
  --warn: #ff9800;
  --media-bg: #000;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1a2e;
    --surface: #16213e;
    --sidebar-bg: #0f3460;
    --chat-bg: #0d0d1a;
    --bubble-out: #1e5799;
    --bubble-in: #1e2d40;
    --fg: #e8e8e8;
    --fg2: #aaa;
    --fg3: #666;
    --border: #2a2a4a;
    --hover: #1e2d40;
    --shadow: 0 1px 4px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1a2e;
  --surface: #16213e;
  --sidebar-bg: #0f3460;
  --chat-bg: #0d0d1a;
  --bubble-out: #1e5799;
  --bubble-in: #1e2d40;
  --fg: #e8e8e8;
  --fg2: #aaa;
  --fg3: #666;
  --border: #2a2a4a;
  --hover: #1e2d40;
  --shadow: 0 1px 4px rgba(0,0,0,.4);
  color-scheme: dark;
}

/* ── RESET ───────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Inter',system-ui,sans-serif;font-size:14px;background:var(--bg);color:var(--fg)}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
input,textarea{font-family:inherit;color:inherit;background:none;border:none;outline:none}
img{max-width:100%;display:block}
a{color:var(--accent);text-decoration:none}
[hidden]{display:none!important}

/* ── SCROLLBAR ───────────────────────────────────────────────── */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* ── APP LAYOUT ──────────────────────────────────────────────── */
#app{display:flex;height:100%;overflow:hidden}
#sidebar{width:320px;min-width:320px;display:flex;flex-direction:column;background:var(--sidebar-bg);border-right:1px solid var(--border);position:relative;z-index:10}
#main{flex:1;display:flex;flex-direction:column;background:var(--chat-bg);position:relative;overflow:hidden}

@media(max-width:640px){
  #sidebar{position:fixed;inset:0;width:100%;transform:translateX(-100%);transition:transform .25s ease;z-index:100}
  #sidebar.open{transform:translateX(0)}
  #main{width:100%}
}

/* ── LOGIN SCREEN ────────────────────────────────────────────── */
#login-screen{position:fixed;inset:0;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:16px;padding:32px}
#login-screen .logo{font-size:64px;line-height:1}
#login-screen h1{font-size:24px;font-weight:600;color:var(--accent)}
#login-screen p{color:var(--fg2);text-align:center;max-width:300px;line-height:1.5}
.login-card{background:var(--bg);border-radius:16px;padding:24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
.login-card label{font-size:12px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.5px}
.inp-wrap{display:flex;align-items:center;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;overflow:hidden;transition:border-color .2s}
.inp-wrap:focus-within{border-color:var(--accent)}
.inp-wrap select,.inp-wrap input{padding:10px 12px;background:none;font-size:14px;width:100%}
.inp-wrap select{width:auto;flex-shrink:0;border-right:1px solid var(--border);cursor:pointer}
.btn-primary{background:var(--accent);color:#fff;border-radius:10px;padding:12px;font-size:15px;font-weight:600;text-align:center;transition:background .2s}
.btn-primary:hover{background:var(--accent2)}
.btn-primary:disabled{opacity:.5;cursor:default}
#login-status{text-align:center;color:var(--fg2);font-size:13px;min-height:18px}
#otp-wrap{display:none;flex-direction:column;gap:12px}
#login-screen.otp-step #otp-wrap{display:flex}
#login-screen.otp-step #phone-wrap{display:none}

/* ── SIDEBAR HEADER ──────────────────────────────────────────── */
#sidebar-header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--sidebar-bg)}
#sidebar-header .app-name{font-weight:700;font-size:16px;color:var(--accent);flex:1}
.icon-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--fg2);transition:background .15s;flex-shrink:0}
.icon-btn:hover{background:var(--hover)}
.icon-btn svg{width:20px;height:20px;fill:currentColor}

/* ── SEARCH BAR ──────────────────────────────────────────────── */
#search-wrap{padding:8px 12px;border-bottom:1px solid var(--border)}
#search-inp{width:100%;background:var(--hover);border-radius:20px;padding:8px 14px;font-size:13px;color:var(--fg)}
#search-inp::placeholder{color:var(--fg3)}

/* ── DIALOG LIST ──────────────────────────────────────────────── */
#dialog-list{flex:1;overflow-y:auto}
.dialog-item{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;transition:background .12s;border-bottom:1px solid var(--border)}
.dialog-item:hover{background:var(--hover)}
.dialog-item.active{background:var(--hover)}
.d-avatar{width:46px;height:46px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:16px;flex-shrink:0;overflow:hidden;position:relative}
.d-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.d-avatar .online-dot{position:absolute;bottom:1px;right:1px;width:11px;height:11px;border-radius:50%;background:var(--online);border:2px solid var(--sidebar-bg)}
.d-info{flex:1;min-width:0}
.d-row1{display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.d-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.d-time{font-size:11px;color:var(--fg3);flex-shrink:0}
.d-row2{display:flex;justify-content:space-between;align-items:center;gap:4px}
.d-preview{font-size:13px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.d-badge{background:var(--accent);color:#fff;border-radius:10px;padding:1px 6px;font-size:11px;font-weight:600;flex-shrink:0}
.d-muted .d-badge{background:var(--fg3)}

/* ── CHAT HEADER ──────────────────────────────────────────────── */
#chat-header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);min-height:56px}
#back-btn{display:none}
@media(max-width:640px){#back-btn{display:flex}}
#chat-avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:14px;flex-shrink:0;overflow:hidden}
#chat-avatar img{width:100%;height:100%;object-fit:cover}
#chat-info{flex:1;min-width:0}
#chat-name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chat-status{font-size:12px;color:var(--fg3)}
#chat-status.online{color:var(--online)}

/* ── EMPTY STATE ──────────────────────────────────────────────── */
#empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--fg3)}
#empty-state .big-icon{font-size:80px}
#empty-state p{font-size:15px}

/* ── MESSAGES AREA ───────────────────────────────────────────── */
#msgs-wrap{flex:1;overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.date-divider{text-align:center;padding:6px 0;color:var(--fg3);font-size:12px;position:sticky;top:0;z-index:1}
.date-divider span{background:rgba(0,0,0,.12);border-radius:12px;padding:3px 10px}

/* ── BUBBLE ──────────────────────────────────────────────────── */
.msg-row{display:flex;gap:6px;max-width:100%;padding:1px 0}
.msg-row.out{flex-direction:row-reverse}
.msg-row.in .msg-bubble-wrap{align-items:flex-start}
.msg-row.out .msg-bubble-wrap{align-items:flex-end}
.msg-avatar-sm{width:28px;height:28px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;flex-shrink:0;align-self:flex-end;overflow:hidden}
.msg-avatar-sm img{width:100%;height:100%;object-fit:cover}
.msg-bubble-wrap{display:flex;flex-direction:column;max-width:68%;min-width:80px}
@media(max-width:640px){.msg-bubble-wrap{max-width:88%}}
.msg-sender{font-size:12px;font-weight:600;color:var(--accent);padding:0 4px;margin-bottom:2px}
.bubble{background:var(--bubble-in);border-radius:var(--radius);border-bottom-left-radius:4px;padding:7px 10px;box-shadow:var(--shadow);position:relative;word-break:break-word;line-height:1.45}
.msg-row.out .bubble{background:var(--bubble-out);border-bottom-left-radius:var(--radius);border-bottom-right-radius:4px}
.bubble .msg-text{white-space:pre-wrap}
.bubble-meta{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:3px}
.msg-time{font-size:10px;color:var(--fg3)}
.tick{font-size:13px;color:var(--fg3)}
.tick.read{color:var(--accent)}

/* ── REPLY PREVIEW ───────────────────────────────────────────── */
.reply-quote{border-left:3px solid var(--accent);padding:3px 8px;background:rgba(33,150,243,.08);border-radius:4px;margin-bottom:5px;cursor:pointer}
.reply-quote .rq-name{font-size:11px;font-weight:600;color:var(--accent)}
.reply-quote .rq-text{font-size:12px;color:var(--fg2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* ── MEDIA IN BUBBLE ──────────────────────────────────────────── */
.bubble-media{border-radius:12px;overflow:hidden;max-width:280px;margin-bottom:4px;cursor:pointer}
.bubble-media img,.bubble-media video{width:100%;max-height:320px;object-fit:cover;display:block}
.bubble-media.sticker{background:transparent!important;box-shadow:none!important;border-radius:0;max-width:160px}
.bubble-media.sticker img{max-height:160px;object-fit:contain}
.file-bubble{display:flex;align-items:center;gap:8px;background:var(--hover);border-radius:10px;padding:8px;min-width:200px;cursor:pointer}
.file-icon{font-size:28px;flex-shrink:0}
.file-info{flex:1;min-width:0}
.file-name{font-weight:500;font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.file-size{font-size:11px;color:var(--fg3)}
.audio-bubble{display:flex;align-items:center;gap:8px;min-width:180px;padding:4px 0}
.audio-bubble button{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.audio-progress{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden;cursor:pointer}
.audio-progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .1s}

/* ── REACTIONS ───────────────────────────────────────────────── */
.msg-reactions{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.reaction-chip{background:var(--hover);border:1px solid var(--border);border-radius:12px;padding:2px 7px;font-size:13px;cursor:pointer;transition:background .15s;user-select:none}
.reaction-chip:hover,.reaction-chip.mine{background:rgba(33,150,243,.15);border-color:var(--accent)}

/* ── CONTEXT MENU ────────────────────────────────────────────── */
#ctx-menu{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.2);z-index:500;min-width:180px;overflow:hidden;animation:fadeIn .1s ease}
@keyframes fadeIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.ctx-item{padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .12s;font-size:14px}
.ctx-item:hover{background:var(--hover)}
.ctx-item.danger{color:var(--danger)}
.ctx-sep{height:1px;background:var(--border);margin:2px 0}

/* ── REACTION PICKER ──────────────────────────────────────────── */
#reaction-picker{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:0 4px 20px rgba(0,0,0,.2);z-index:501;display:flex;gap:4px;padding:6px 10px;animation:fadeIn .1s ease}
.react-btn{font-size:22px;cursor:pointer;padding:2px 4px;border-radius:6px;transition:transform .15s;line-height:1}
.react-btn:hover{transform:scale(1.3)}

/* ── FORWARD SHEET ────────────────────────────────────────────── */
#forward-sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:600;display:flex;align-items:flex-end;justify-content:center}
#forward-sheet .sheet{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-width:480px;max-height:70vh;display:flex;flex-direction:column;padding:16px 0}
#forward-sheet h3{padding:0 16px 12px;font-size:16px;font-weight:600}
#forward-list{flex:1;overflow-y:auto}
.fw-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;transition:background .12s}
.fw-item:hover{background:var(--hover)}
.fw-avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600;flex-shrink:0}
.fw-name{font-weight:500}

/* ── DELETE CONFIRM ───────────────────────────────────────────── */
#del-modal{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:700;display:flex;align-items:center;justify-content:center;padding:24px}
#del-modal .modal{background:var(--surface);border-radius:14px;padding:20px;max-width:340px;width:100%;display:flex;flex-direction:column;gap:14px}
#del-modal h3{font-size:16px;font-weight:600}
#del-modal p{color:var(--fg2);font-size:14px;line-height:1.5}
.del-actions{display:flex;flex-direction:column;gap:8px}
.btn-del-ev{background:var(--danger);color:#fff;border-radius:10px;padding:11px;font-size:14px;font-weight:600;text-align:center}
.btn-del-me{background:var(--hover);color:var(--fg);border-radius:10px;padding:11px;font-size:14px;font-weight:600;text-align:center}
.btn-cancel{background:none;color:var(--fg2);text-align:center;padding:8px;font-size:14px}

/* ── MEDIA VIEWER ────────────────────────────────────────────── */
#media-viewer{position:fixed;inset:0;background:#000;z-index:800;display:flex;flex-direction:column}
#media-viewer .mv-header{display:flex;align-items:center;gap:8px;padding:10px 14px;color:#fff}
#media-viewer .mv-header button{color:#fff}
#media-viewer .mv-body{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
#media-viewer img,#media-viewer video{max-width:100%;max-height:100%;object-fit:contain}

/* ── EMOJI PICKER ────────────────────────────────────────────── */
#emoji-picker{position:absolute;bottom:60px;left:0;width:320px;max-width:100%;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,.2);z-index:200;display:flex;flex-direction:column;overflow:hidden}
.ep-tabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto}
.ep-tab{padding:8px 10px;font-size:18px;cursor:pointer;border-bottom:2px solid transparent;flex-shrink:0;transition:border-color .15s}
.ep-tab.active{border-color:var(--accent)}
.ep-search{padding:6px 10px;border-bottom:1px solid var(--border)}
.ep-search input{width:100%;background:var(--hover);border-radius:8px;padding:5px 10px;font-size:13px;color:var(--fg)}
.ep-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:6px;overflow-y:auto;max-height:200px}
.ep-cell{font-size:22px;text-align:center;cursor:pointer;border-radius:6px;padding:3px;transition:background .12s;line-height:1.3}
.ep-cell:hover{background:var(--hover)}
.ep-sticker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;overflow-y:auto;max-height:200px}
.ep-sticker{cursor:pointer;border-radius:8px;padding:4px;transition:background .12s}
.ep-sticker:hover{background:var(--hover)}
.ep-sticker img{width:60px;height:60px;object-fit:contain}

/* ── INPUT AREA ──────────────────────────────────────────────── */
#input-area{background:var(--surface);border-top:1px solid var(--border);position:relative}
#reply-bar{display:flex;align-items:center;gap:8px;padding:6px 10px 0;background:var(--surface)}
#reply-bar .rb-content{flex:1;min-width:0;border-left:3px solid var(--accent);padding-left:8px}
#reply-bar .rb-name{font-size:11px;font-weight:600;color:var(--accent)}
#reply-bar .rb-text{font-size:12px;color:var(--fg2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#reply-bar button{color:var(--fg3);padding:4px}
#input-row{display:flex;align-items:flex-end;gap:4px;padding:6px 8px}
.inp-action{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--fg2);flex-shrink:0;transition:background .12s}
.inp-action:hover{background:var(--hover);color:var(--accent)}
.inp-action svg{width:22px;height:22px;fill:currentColor}
#msg-inp{flex:1;background:var(--hover);border-radius:20px;padding:9px 14px;font-size:14px;resize:none;max-height:120px;overflow-y:auto;line-height:1.4;color:var(--fg)}
#msg-inp::placeholder{color:var(--fg3)}
#send-btn{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s,transform .15s}
#send-btn:hover{background:var(--accent2);transform:scale(1.05)}
#send-btn svg{width:20px;height:20px;fill:currentColor}

/* ── VOICE NOTE REC ───────────────────────────────────────────── */
#voice-overlay{position:absolute;inset:0;background:var(--surface);display:flex;align-items:center;justify-content:center;gap:16px;z-index:10}
.voice-timer{font-size:20px;font-weight:600;color:var(--danger)}
.voice-pulse{width:14px;height:14px;border-radius:50%;background:var(--danger);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── TYPING INDICATOR ────────────────────────────────────────── */
#typing-indicator{padding:4px 16px;color:var(--fg3);font-size:12px;font-style:italic;min-height:18px}

/* ── LOAD MORE ───────────────────────────────────────────────── */
#load-more-btn{align-self:center;padding:6px 18px;background:var(--surface);border:1px solid var(--border);border-radius:20px;color:var(--fg2);font-size:12px;cursor:pointer;transition:background .15s}
#load-more-btn:hover{background:var(--hover)}

/* ── TOAST ───────────────────────────────────────────────────── */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;border-radius:8px;padding:8px 16px;font-size:13px;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}

/* ── THEME TOGGLE ────────────────────────────────────────────── */
</style>
</head>

<body>
<!-- ═══════════════════ LOGIN SCREEN ═══════════════════════════ -->
<div id="login-screen">
  <div class="logo">✈️</div>
  <h1>MyGram</h1>
  <p>Log masuk dengan nombor telefon Telegram anda</p>

  <div class="login-card">
    <!-- Phone Step -->
    <div id="phone-wrap">
      <label>Nombor Telefon</label>
      <div class="inp-wrap">
        <select id="inp-cc">
          <option value="+60" selected>🇲🇾 +60</option>
          <option value="+65">🇸🇬 +65</option>
          <option value="+62">🇮🇩 +62</option>
          <option value="+66">🇹🇭 +66</option>
          <option value="+63">🇵🇭 +63</option>
          <option value="+84">🇻🇳 +84</option>
          <option value="+880">🇧🇩 +880</option>
          <option value="+91">🇮🇳 +91</option>
          <option value="+44">🇬🇧 +44</option>

function fmtTime(ts){
  if(!ts) return "";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleTimeString("ms-MY",{hour:"2-digit",minute:"2-digit"});
}
function fmtDate(ts){
  if(!ts) return "";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const now = new Date();
  if(d.toDateString()===now.toDateString()) return "Hari ini";
  const yes = new Date(now); yes.setDate(yes.getDate()-1);
  if(d.toDateString()===yes.toDateString()) return "Semalam";
  return d.toLocaleDateString("ms-MY",{day:"numeric",month:"short",year:"numeric"});
}
function escHtml(s){
  if(!s) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function toast(msg, dur=2500){
  const t = el("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), dur);
}
function avatarInitial(name){
  if(!name) return "?";
  const words = name.trim().split(" ");
  return words.length>=2 ? words[0][0]+words[1][0] : name[0];
}
function fmtFileSize(bytes){
  if(!bytes) return "";
  if(bytes<1024) return bytes+"B";
  if(bytes<1024*1024) return (bytes/1024).toFixed(1)+"KB";
  return (bytes/1024/1024).toFixed(1)+"MB";
}

  if(num.length<6){ toast("Nombor tidak sah"); return; }

  el("btn-send-phone").disabled = true;
  setLoginStatus("Meminta OTP...");

  try{
    // Write to mygram_session/creds (if not exists — worker reads this)
    const credsRef = doc(`${P}/mygram_session/creds`);
    const snap = await credsRef.get();
    if(!snap.exists){
      setLoginStatus("Sila masukkan API ID & Hash dalam Firestore dulu.\nPath: users/UID/mygram_session/creds { apiId, apiHash, phone }");
      el("btn-send-phone").disabled = false;
      return;
    }

    // Update phone in case changed
    await credsRef.update({ phone });

    // Trigger login
    const loginRef = doc(`${P}/mygram_worker/login`);
    await loginRef.set({
      mula: true,
      phone,
      requestedAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    setLoginStatus("Menunggu OTP...");
    el("login-screen").classList.add("otp-step");
    pollLoginStatus();

  }catch(e){
    console.error(e);
    setLoginStatus("Ralat: "+e.message);
    el("btn-send-phone").disabled = false;
  }
};

function pollLoginStatus(){
  const loginRef = doc(`${P}/mygram_worker/login`);
  loginPollInterval = setInterval(async ()=>{
    try{
      const snap = await loginRef.get();
      if(!snap.exists) return;
      const data = snap.data();
      if(data.tahap === "otp"){
        setLoginStatus("Masukkan kod OTP yang diterima dalam Telegram.");
      } else if(data.tahap === "2fa"){
        setLoginStatus("Masukkan kata laluan 2FA.");
      } else if(data.tahap === "ok"){
        clearInterval(loginPollInterval);
        setLoginStatus("Login berjaya!");
        setTimeout(enterApp, 800);
      } else if(data.tahap === "ralat"){
        clearInterval(loginPollInterval);
        setLoginStatus("Ralat: "+(data.mesej||"Cuba lagi."));
        el("login-screen").classList.remove("otp-step");
        el("btn-send-phone").disabled = false;
      }
    }catch(e){ console.error(e); }
  }, 2000);
}

el("btn-submit-otp").onclick = async ()=>{
  const otp = el("inp-otp").value.trim();
  const twofa = el("inp-2fa").value;
  if(!otp){ toast("Masukkan OTP"); return; }

  el("btn-submit-otp").disabled = true;
  setLoginStatus("Mengesahkan...");

  await doc(`${P}/mygram_worker/login`).update({
    otp,
    twofa: twofa||"",
    otpAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  el("btn-submit-otp").disabled = false;
};

el("btn-back-phone").onclick = ()=>{
  clearInterval(loginPollInterval);
  el("login-screen").classList.remove("otp-step");
  el("btn-send-phone").disabled = false;
  setLoginStatus("");
};

// Check if already logged in
async function checkLogin(){
  try{
    const statusRef = doc(`${P}/mygram_worker/status`);
    const snap = await statusRef.get();
    if(snap.exists && snap.data().state === "connected"){
      enterApp();
      return;
    }
    // Also check session exists
    const sessionSnap = await doc(`${P}/mygram_session/main`).get();
    if(sessionSnap.exists && sessionSnap.data().session){
      enterApp();
      return;
    }
  }catch(e){ console.error(e); }
}
checkLogin();

function subscribeDialogs(){

function renderDialogs(){
  const q = searchQuery.toLowerCase();
  const list = q ? dialogs.filter(d=>(d.name||"").toLowerCase().includes(q)) : dialogs;

function dialogHTML(d){

  const preview = d.lastMsg ? escHtml(d.lastMsg).substring(0,60) : "📷 Media";
  const badge = d.unread ? `<span class="d-badge">${d.unread}</span>` : "";
  const active = String(d.id)===String(activeChatId) ? " active" : "";
  const avatarImg = d.photo ? `<img src="${d.photo}" alt=""/>` : `${initials}`;
  return `<div class="dialog-item${active}" data-id="${d.id}">
    <div class="d-avatar">${avatarImg}${online}</div>

// OPEN CHAT
// ══════════════════════════════════════════════════════════════════
function openChat(chatId, chatData){
  activeChatId = String(chatId);
  activeChatData = chatData || {};

  // Mobile: hide sidebar
  el("sidebar").classList.remove("open");
  el("empty-state").hidden = true;
  el("chat-view").hidden = false;

  // Header
  const name = chatData?.name || "Chat";
  el("chat-name").textContent = name;
  const initials = avatarInitial(name);
  const av = el("chat-avatar");
  if(chatData?.photo){
    av.innerHTML = `<img src="${chatData.photo}" alt=""/>`;
  } else {
    av.textContent = initials;
  }

  // Status
  updateChatStatus(chatData);

  // Reset
  replyToMsg = null;
  el("reply-bar").hidden = true;
  el("msgs-wrap").innerHTML = "";
  el("load-more-btn").hidden = true;
  oldestMsgId = null;
  messages[activeChatId] = [];

  // Unsubscribe old listeners
  msgsUnsubscribe && msgsUnsubscribe();
  typingUnsubscribe && typingUnsubscribe();

  // Subscribe messages
  subscribeMessages(activeChatId);
  subscribeTyping(activeChatId);

  // Mark dialogs active
  renderDialogs();

  // Request worker to load messages if none cached
  triggerLoadMessages(chatId);
}

function updateChatStatus(d){
  const statusEl = el("chat-status");
  if(!d){ statusEl.textContent=""; statusEl.className=""; return; }
  if(d.online){
    statusEl.textContent = "dalam talian";
    statusEl.className = "online";
  } else if(d.lastSeen){
    statusEl.textContent = "terakhir dilihat "+fmtTime(d.lastSeen);
    statusEl.className = "";
  } else if(d.isGroup){
    statusEl.textContent = (d.memberCount||"")+" ahli";
    statusEl.className = "";
  } else {
    statusEl.textContent = "luar talian";
    statusEl.className = "";
  }
}

function triggerLoadMessages(chatId, offsetId=0){
  doc(`${P}/mygram_worker/cmd`).set({
    cmd: "load_messages",
    chatId: String(chatId),
    offsetId,
    at: firebase.firestore.FieldValue.serverTimestamp()
  });
}

// ══════════════════════════════════════════════════════════════════
// MESSAGES SUBSCRIPTION
// ══════════════════════════════════════════════════════════════════
function subscribeMessages(chatId){
  const msgsCol = col(`${P}/mygram_messages/${chatId}/msgs`);
  msgsUnsubscribe = msgsCol
    .orderBy("date","asc")
    .limit(80)
    .onSnapshot(snap=>{
      if(chatId !== activeChatId) return;
      const arr = [];
      snap.forEach(d=>{ arr.push({id:d.id, ...d.data()}); });
      messages[chatId] = arr;
      if(arr.length) oldestMsgId = arr[0].msgId || arr[0].id;
      renderMessages(chatId, arr);
      scrollToBottom();
    });
}

function renderMessages(chatId, arr){
  const wrap = el("msgs-wrap");
  wrap.innerHTML = "";

  // Load more btn
  const lmBtn = el("load-more-btn");
  lmBtn.hidden = (arr.length < 30);
  wrap.appendChild(lmBtn);

  let lastDate = null;
  arr.forEach((msg, i)=>{
    const msgDate = msg.date ? fmtDate(msg.date) : "";
    if(msgDate !== lastDate){
      lastDate = msgDate;
      const divider = document.createElement("div");
      divider.className = "date-divider";
      divider.innerHTML = `<span>${escHtml(msgDate)}</span>`;
      wrap.appendChild(divider);
    }
    const row = buildMsgElement(msg, i>0 ? arr[i-1] : null);
    wrap.appendChild(row);
  });
}

function buildMsgElement(msg, prevMsg){
  const isOut = msg.out === true;
  const isGroup = activeChatData?.isGroup;
  const showAvatar = !isOut && isGroup;
  const sameUser = prevMsg && prevMsg.senderId === msg.senderId && !isOut;

  const row = document.createElement("div");
  row.className = `msg-row ${isOut?"out":"in"}`;
  row.dataset.msgId = msg.msgId || msg.id;

  let avatarHtml = "";
  if(showAvatar){
    const initials = avatarInitial(msg.senderName||"?");
    avatarHtml = `<div class="msg-avatar-sm" title="${escHtml(msg.senderName||'')}">${initials}</div>`;
  }

  let senderHtml = "";
  if(isGroup && !isOut && !sameUser){
    const color = nameColor(msg.senderName);
    senderHtml = `<div class="msg-sender" style="color:${color}">${escHtml(msg.senderName||"")}</div>`;
  }

  const bubbleInner = buildBubbleContent(msg, isOut);
  const reactionHtml = buildReactionsHtml(msg);

  const tick = isOut ? buildTick(msg) : "";

  row.innerHTML = `
    ${avatarHtml}
    <div class="msg-bubble-wrap">
      ${senderHtml}
      <div class="bubble" data-msg-id="${escHtml(String(msg.msgId||msg.id))}">
        ${buildReplyQuote(msg)}
        ${bubbleInner}
        <div class="bubble-meta">
          <span class="msg-time">${fmtTime(msg.date)}</span>
          ${tick}
        </div>
      </div>
      ${reactionHtml}
    </div>`;

  // Long press / right click for context menu
  const bubble = row.querySelector(".bubble");
  let pressTimer;
  bubble.addEventListener("contextmenu", e=>{ e.preventDefault(); showCtxMenu(e, msg, isOut); });
  bubble.addEventListener("touchstart", ()=>{ pressTimer = setTimeout(()=>showCtxMenuTouch(bubble, msg, isOut), 600); });
  bubble.addEventListener("touchend", ()=> clearTimeout(pressTimer));
  bubble.addEventListener("touchmove", ()=> clearTimeout(pressTimer));

  // Double-tap to react
  let lastTap = 0;
  bubble.addEventListener("touchend", e=>{
    const now = Date.now();
    if(now-lastTap < 300){
      showReactionPicker(e, msg);
    }
    lastTap = now;
  });

  // Reaction chips
  row.querySelectorAll(".reaction-chip").forEach(chip=>{
    chip.onclick = ()=> sendReaction(msg, chip.dataset.emoji);
  });

  return row;
}

function buildBubbleContent(msg, isOut){
  const mediaType = msg.mediaType;

  if(mediaType === "photo" || mediaType === "video"){
    const src = msg.mediaData ? "data:"+msg.mediaMime+";base64,"+msg.mediaData : msg.mediaUrl||"";
    if(!src) return `<div style="color:var(--fg3);font-size:12px">📷 Sedang memuatkan...</div>`;
    if(mediaType==="video"){
      return `<div class="bubble-media" onclick="openMediaViewer('${escHtml(src)}','video')">
        <video src="${escHtml(src)}" preload="metadata" style="pointer-events:none"></video>
        <div style="position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,.5);color:#fff;border-radius:4px;padding:2px 6px;font-size:11px">▶</div>
      </div>`;
    }
    return `<div class="bubble-media" onclick="openMediaViewer('${escHtml(src)}','image')">
      <img src="${escHtml(src)}" alt="Gambar" loading="lazy"/>
    </div>`;
  }

  if(mediaType === "sticker"){
    const src = msg.mediaData ? "data:"+msg.mediaMime+";base64,"+msg.mediaData : msg.mediaUrl||"";
    return `<div class="bubble-media sticker">
      <img src="${escHtml(src)||'data:,'}" alt="Sticker" loading="lazy"/>
    </div>`;
  }

  if(mediaType === "audio" || mediaType === "voice"){
    const src = msg.mediaData ? "data:audio/ogg;base64,"+msg.mediaData : msg.mediaUrl||"";
    const audioId = "aud-"+( msg.msgId||msg.id);
    return `<div class="audio-bubble">
      <button onclick="toggleAudio('${audioId}','${escHtml(src)}')">▶</button>
      <div class="audio-progress" id="prog-${audioId}" onclick="seekAudio('${audioId}',event)">
        <div class="audio-progress-fill" id="fill-${audioId}" style="width:0%"></div>
      </div>
      <span class="msg-time" id="dur-${audioId}">0:00</span>
      <audio id="${audioId}" src="${escHtml(src)}" style="display:none" preload="none"
        ontimeupdate="audioTick('${audioId}')" onended="audioEnd('${audioId}')"></audio>
    </div>`;
  }

  if(mediaType === "document"){
    const fname = msg.fileName||"Dokumen";
    const fsize = fmtFileSize(msg.fileSize||0);
    const src = msg.mediaData ? "data:"+msg.mediaMime+";base64,"+msg.mediaData : msg.mediaUrl||"";
    return `<div class="file-bubble" onclick="${src?`downloadFile('${escHtml(src)}','${escHtml(fname)}')`:''}">
      <span class="file-icon">${fileIcon(fname)}</span>
      <div class="file-info">
        <div class="file-name">${escHtml(fname)}</div>
        <div class="file-size">${fsize}</div>
      </div>
    </div>`;
  }

  if(mediaType === "location"){
    return `<div style="padding:4px 0">
      📍 <a href="https://maps.google.com/?q=${msg.lat||0},${msg.lng||0}" target="_blank" style="color:var(--accent)">Lihat Lokasi</a>
    </div>`;
  }

  // Text
  const text = msg.text||msg.message||"";
  if(!text && !mediaType) return `<div style="color:var(--fg3);font-size:12px">[mesej kosong]</div>`;
  return `<div class="msg-text">${linkify(escHtml(text))}</div>`;
}

function buildReplyQuote(msg){
  if(!msg.replyTo) return "";
  const rname = escHtml(msg.replyToName||"Mesej");
  const rtext = escHtml((msg.replyToText||"").substring(0,80));
  return `<div class="reply-quote" onclick="scrollToMsg('${escHtml(String(msg.replyTo))}')">
    <div class="rq-name">${rname}</div>
    <div class="rq-text">${rtext}</div>
  </div>`;
}

function buildReactionsHtml(msg){
  if(!msg.reactions || !Object.keys(msg.reactions).length) return "";
  const chips = Object.entries(msg.reactions).map(([emoji,count])=>{
    return `<span class="reaction-chip" data-emoji="${escHtml(emoji)}">${emoji} ${count}</span>`;
  }).join("");
  return `<div class="msg-reactions">${chips}</div>`;
}

function buildTick(msg){
  if(msg.sendFailed) return `<span class="tick" style="color:var(--danger)">✕</span>`;
  if(msg.pending) return `<span class="tick">🕐</span>`;
  if(msg.read) return `<span class="tick read">✓✓</span>`;
  if(msg.delivered) return `<span class="tick">✓✓</span>`;
  return `<span class="tick">✓</span>`;
}

function nameColor(name){
  const colors = ["#e91e63","#9c27b0","#2196f3","#009688","#ff5722","#607d8b","#795548"];
  let h = 0;
  for(let c of (name||"")) h = (h*31+c.charCodeAt(0)) & 0xffff;
  return colors[h%colors.length];
}

function linkify(text){
  return text.replace(/(https?:\/\/[^\s<>"]+)/g, '<a href="$1" target="_blank">$1</a>');
}

function fileIcon(name){
  const ext = (name||"").split(".").pop().toLowerCase();
  const map = { pdf:"📄", doc:"📝", docx:"📝", xls:"📊", xlsx:"📊", ppt:"📊", pptx:"📊",
    zip:"🗜", rar:"🗜", "7z":"🗜", mp3:"🎵", mp4:"🎬", avi:"🎬", mkv:"🎬", jpg:"🖼", png:"🖼" };
  return map[ext]||"📁";
}

msgInp.addEventListener("keydown", e=>{
  if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); sendMessage(); }

async function sendMessage(){
  if(!activeChatId) return;
  const text = msgInp.value.trim();
  if(!text) return;

  msgInp.value = "";
  msgInp.style.height = "auto";

  const payload = {
    chatId: String(activeChatId),
    text,
    at: firebase.firestore.FieldValue.serverTimestamp(),
    pending: true
  };

  if(replyToMsg){
    payload.replyToMsgId = replyToMsg.msgId || replyToMsg.id;
    cancelReply();
  }

  // Optimistic local display
  const tempId = "temp-"+Date.now();
  const tempMsg = {
    id: tempId, msgId: tempId, out: true, text, pending: true,
    date: new Date(), replyTo: payload.replyToMsgId,
    replyToText: replyToMsg?.text, replyToName: "Anda"
  };
  if(!messages[activeChatId]) messages[activeChatId]=[];
  messages[activeChatId].push(tempMsg);
  renderMessages(activeChatId, messages[activeChatId]);
  scrollToBottom();

  try{
    await col(`${P}/mygram_outbox`).add(payload);
  }catch(e){
    toast("Gagal hantar: "+e.message);
  }
}

el("btn-attach").onclick = ()=> el("file-pick").click();

el("file-pick").onchange = async e=>{
  const files = Array.from(e.target.files);
  e.target.value = "";
  for(const file of files) await sendFile(file);
};

async function sendFile(file){
  if(!activeChatId) return;
  const maxBytes = 50*1024*1024; // 50MB
  if(file.size > maxBytes){ toast("Fail terlalu besar (max 50MB)"); return; }

  toast("Memuat naik...");
  const reader = new FileReader();
  reader.onload = async (ev)=>{
    const dataUrl = ev.target.result; // base64 with prefix
    const payload = {
      chatId: String(activeChatId),
      fileName: file.name,
      fileSize: file.size,
      mimeType: file.type,
      dataUrl,
      at: firebase.firestore.FieldValue.serverTimestamp()
    };
    if(replyToMsg){
      payload.replyToMsgId = replyToMsg.msgId||replyToMsg.id;
      cancelReply();
    }
    try{
      await col(`${P}/mygram_media_outbox`).add(payload);
      toast("Dihantar ✓");
    }catch(e){
      toast("Gagal: "+e.message);
    }
  };
  reader.readAsDataURL(file);
}

// VOICE NOTE
// ══════════════════════════════════════════════════════════════════
el("btn-voice").onclick = startVoiceRec;
el("btn-stop-voice").onclick = stopVoiceRec;
el("btn-cancel-voice").onclick = cancelVoiceRec;

async function startVoiceRec(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    voiceChunks = [];
    voiceSeconds = 0;
    mediaRecorder.ondataavailable = e=> voiceChunks.push(e.data);
    mediaRecorder.onstop = sendVoiceNote;
    mediaRecorder.start();
    el("voice-overlay").hidden = false;
    el("voice-timer").textContent = "0:00";
    voiceTimerInt = setInterval(()=>{
      voiceSeconds++;
      const m = Math.floor(voiceSeconds/60), s = voiceSeconds%60;
      el("voice-timer").textContent = `${m}:${s.toString().padStart(2,"0")}`;
    }, 1000);
  }catch(e){ toast("Microphone tidak dibenar"); }
}

function stopVoiceRec(){
  clearInterval(voiceTimerInt);
  el("voice-overlay").hidden = true;
  if(mediaRecorder && mediaRecorder.state!=="inactive") mediaRecorder.stop();
}

function cancelVoiceRec(){
  clearInterval(voiceTimerInt);
  el("voice-overlay").hidden = true;
  if(mediaRecorder && mediaRecorder.state!=="inactive"){
    mediaRecorder.stop();
    voiceChunks = [];
    mediaRecorder.onstop = null;
  }
}

async function sendVoiceNote(){
  if(!voiceChunks.length) return;
  const blob = new Blob(voiceChunks, { type:"audio/webm;codecs=opus" });
  const file = new File([blob], "voice_"+Date.now()+".ogg", { type:"audio/ogg" });
  await sendFile(file);
}

  const picker = el("emoji-picker");
  picker.hidden = !picker.hidden;
  if(!picker.hidden && !emojiPickerBuilt) buildEmojiPicker();
};

function buildEmojiPicker(){
  emojiPickerBuilt = true;
  const picker = el("emoji-picker");
  picker.innerHTML = "";

  // Tabs
  const tabs = document.createElement("div");
  tabs.className = "ep-tabs";
  Object.keys(EMOJI_CATS).forEach(cat=>{
    const t = document.createElement("div");
    t.className = "ep-tab"+(cat===activeCat?" active":"");
    t.textContent = cat;
    t.onclick = ()=>{
      activeCat = cat;
      tabs.querySelectorAll(".ep-tab").forEach(x=>x.classList.remove("active"));
      t.classList.add("active");
      renderEmojiGrid(grid, cat);
    };
    tabs.appendChild(t);
  });
  picker.appendChild(tabs);

  // Search
  const sw = document.createElement("div");
  sw.className = "ep-search";
  const si = document.createElement("input");
  si.placeholder = "Cari emoji...";
  si.oninput = ()=>{
    const q = si.value.toLowerCase();
    const all = Object.values(EMOJI_CATS).flat();
    renderEmojiGrid(grid, null, q ? all.filter(e=>e.includes(q)||e.codePointAt(0).toString(16).includes(q)) : EMOJI_CATS[activeCat]);
  };
  sw.appendChild(si);
  picker.appendChild(sw);

  // Grid
  const grid = document.createElement("div");
  grid.className = "ep-grid";
  picker.appendChild(grid);
  renderEmojiGrid(grid, activeCat);
}

function renderEmojiGrid(grid, cat, custom){
  const emojis = custom || (cat ? EMOJI_CATS[cat] : []);
  grid.innerHTML = emojis.map(e=>`<div class="ep-cell" onclick="insertEmoji('${e}')">${e}</div>`).join("");
}

window.insertEmoji = function(emoji){
  const inp = el("msg-inp");
  const start = inp.selectionStart||0;
  const val = inp.value;
  inp.value = val.slice(0,start)+emoji+val.slice(inp.selectionEnd||start);
  inp.setSelectionRange(start+emoji.length, start+emoji.length);
  inp.focus();
};

document.addEventListener("click", e=>{
  const picker = el("emoji-picker");
  if(!picker.hidden && !picker.contains(e.target) && e.target!==el("btn-emoji")){
    picker.hidden = true;
  }
  if(!el("ctx-menu").hidden) hideCtx();
  if(!el("reaction-picker").hidden) el("reaction-picker").hidden = true;
});

// ══════════════════════════════════════════════════════════════════
// REPLY
// ══════════════════════════════════════════════════════════════════
function setReply(msg){
  replyToMsg = msg;
  el("reply-bar").hidden = false;
  el("reply-name").textContent = msg.out ? "Anda" : (msg.senderName||activeChatData?.name||"");
  el("reply-text").textContent = msg.text||msg.message||(msg.mediaType?"📎 Media":"");
  el("msg-inp").focus();
}

function cancelReply(){
  replyToMsg = null;
  el("reply-bar").hidden = true;
}

el("btn-cancel-reply").onclick = cancelReply;

// ══════════════════════════════════════════════════════════════════
// CONTEXT MENU
// ══════════════════════════════════════════════════════════════════
function showCtxMenu(e, msg, isOut){
  e.preventDefault();
  buildCtxMenu(msg, isOut, e.clientX, e.clientY);
}

function showCtxMenuTouch(bubble, msg, isOut){
  const rect = bubble.getBoundingClientRect();
  buildCtxMenu(msg, isOut, rect.left, rect.bottom);
}

function buildCtxMenu(msg, isOut, x, y){
  const menu = el("ctx-menu");
  const items = [];

  items.push({ icon:"💬", label:"Balas", action:()=>{ setReply(msg); hideCtx(); }});

  if(msg.text||msg.message){
    items.push({ icon:"📋", label:"Salin", action:()=>{
      try{ navigator.clipboard.writeText(msg.text||msg.message||"").then(()=>toast("Disalin")); }
      catch(e){ toast("Salin gagal"); }
      hideCtx();
    }});
  }

  items.push({ icon:"↗️", label:"Hantar Semula", action:()=>{ showForwardSheet(msg); hideCtx(); }});

  if(!msg.pending){
    items.push({ icon:"😊", label:"Reaksi", action:()=>{
      showReactionPickerById(msg);
      hideCtx();
    }});
  }

  if(isOut){
    items.push({ sep:true });
    items.push({ icon:"🗑", label:"Padam", danger:true, action:()=>{
      deleteTargetId = msg.msgId||msg.id;
      el("del-modal").hidden = false;
      hideCtx();
    }});
  } else {
    items.push({ sep:true });
    items.push({ icon:"🗑", label:"Padam untuk saya", danger:true, action:()=>{
      deleteMsg(msg.msgId||msg.id, false);
      hideCtx();
    }});
  }

  menu.innerHTML = items.map(it=>{
    if(it.sep) return `<div class="ctx-sep"></div>`;
    return `<div class="ctx-item${it.danger?" danger":""}" data-action="${encodeURIComponent(it.label)}">
      <span>${it.icon}</span><span>${it.label}</span>
    </div>`;
  }).join("");

  menu.querySelectorAll(".ctx-item").forEach((el2,i)=>{
    const item = items.filter(x=>!x.sep)[i];
    if(item) el2.onclick = item.action;
  });

  const mx = el("msgs-wrap");
  const mxRect = mx.getBoundingClientRect();
  const menuW = 200, menuH = items.length*42;
  const left = Math.min(x, window.innerWidth-menuW-8);
  const top = Math.min(y, window.innerHeight-menuH-8);
  menu.style.left = left+"px";
  menu.style.top = top+"px";
  menu.hidden = false;
}

function hideCtx(){ el("ctx-menu").hidden = true; }

// ══════════════════════════════════════════════════════════════════
// REACTIONS
// ══════════════════════════════════════════════════════════════════
function showReactionPicker(e, msg){
  e.preventDefault();
  const picker = el("reaction-picker");
  const x = Math.min(e.touches?.[0]?.clientX||e.clientX, window.innerWidth-200);
  const y = Math.max((e.touches?.[0]?.clientY||e.clientY)-60, 10);
  picker.style.left = x+"px";
  picker.style.top = y+"px";
  picker.hidden = false;
  picker.querySelectorAll(".react-btn").forEach(btn=>{
    btn.onclick = ()=>{
      sendReaction(msg, btn.dataset.emoji);
      picker.hidden = true;
    };
  });
}

function showReactionPickerById(msg){
  const bubble = document.querySelector(`[data-msg-id="${msg.msgId||msg.id}"]`);
  if(!bubble) return;
  const rect = bubble.getBoundingClientRect();
  const picker = el("reaction-picker");
  picker.style.left = Math.max(8, rect.left)+"px";
  picker.style.top = Math.max(8, rect.top-60)+"px";
  picker.hidden = false;
  picker.querySelectorAll(".react-btn").forEach(btn=>{
    btn.onclick = ()=>{
      sendReaction(msg, btn.dataset.emoji);
      picker.hidden = true;
    };
  });
}

async function sendReaction(msg, emoji){
  if(!activeChatId) return;
  try{
    await col(`${P}/mygram_reactions`).add({
      chatId: String(activeChatId),
      msgId: String(msg.msgId||msg.id),
      emoji,
      at: firebase.firestore.FieldValue.serverTimestamp()
    });
  }catch(e){ toast("Gagal hantar reaksi"); }
}

el("btn-del-everyone").onclick = ()=>{

async function deleteMsg(msgId, forEveryone){
  if(!activeChatId) return;
  try{
    await col(`${P}/mygram_delete_queue`).add({
      chatId: String(activeChatId),
      msgId: String(msgId),
      forEveryone,
      at: firebase.firestore.FieldValue.serverTimestamp()
    });
    toast(forEveryone ? "Dipadam untuk semua" : "Dipadam untuk saya");

    // Remove from local
    if(messages[activeChatId]){
      messages[activeChatId] = messages[activeChatId].filter(m=>String(m.msgId||m.id)!==String(msgId));
      renderMessages(activeChatId, messages[activeChatId]);
    }
  }catch(e){ toast("Gagal padam"); }
}

// ══════════════════════════════════════════════════════════════════
// FORWARD
// ══════════════════════════════════════════════════════════════════
function showForwardSheet(msg){
  forwardMsgId = msg.msgId||msg.id;
  const sheet = el("forward-sheet");
  const list = el("forward-list");
  list.innerHTML = dialogs.slice(0,30).map(d=>`
    <div class="fw-item" data-id="${d.id}">
      <div class="fw-avatar">${avatarInitial(d.name||"?")}</div>
      <div class="fw-name">${escHtml(d.name||"?")}</div>
    </div>`).join("");
  list.querySelectorAll(".fw-item").forEach(item=>{
    item.onclick = async ()=>{
      const targetId = item.dataset.id;
      await col(`${P}/mygram_outbox`).add({
        chatId: String(targetId),
        forwardFromChatId: String(activeChatId),
        forwardMsgId: String(forwardMsgId),
        at: firebase.firestore.FieldValue.serverTimestamp()
      });
      toast("Dihantar semula ✓");
      sheet.hidden = true;
    };
  });
  sheet.hidden = false;
}

el("btn-cancel-forward").onclick = ()=>{ el("forward-sheet").hidden = true; };

// ══════════════════════════════════════════════════════════════════
// AUDIO PLAYER
// ══════════════════════════════════════════════════════════════════
const audioInstances = {};

window.toggleAudio = function(id, src){
  let audio = audioInstances[id];
  if(!audio){
    audio = el(id);
    if(!audio) return;
    if(src && !audio.src) audio.src = src;
    audioInstances[id] = audio;
  }
  // Pause all others
  Object.values(audioInstances).forEach(a=>{ if(a!==audio && !a.paused){ a.pause(); } });
  const btn = audio.closest(".audio-bubble")?.querySelector("button");
  if(audio.paused){
    audio.play().catch(()=>{});
    if(btn) btn.textContent = "⏸";
  } else {
    audio.pause();
    if(btn) btn.textContent = "▶";
  }
};

window.audioTick = function(id){
  const audio = el(id);
  if(!audio) return;
  const pct = audio.duration ? (audio.currentTime/audio.duration)*100 : 0;
  const fill = el("fill-"+id);
  const dur = el("dur-"+id);
  if(fill) fill.style.width = pct+"%";
  if(dur){
    const t = Math.floor(audio.currentTime);
    dur.textContent = `${Math.floor(t/60)}:${(t%60).toString().padStart(2,"0")}`;
  }
};

window.audioEnd = function(id){
  const audio = el(id);
  const btn = audio?.closest(".audio-bubble")?.querySelector("button");
  if(btn) btn.textContent = "▶";
  const fill = el("fill-"+id);
  if(fill) fill.style.width = "0%";
};

window.seekAudio = function(id, e){
  const audio = el(id);
  const prog = el("prog-"+id);
  if(!audio||!prog||!audio.duration) return;
  const rect = prog.getBoundingClientRect();
  const pct = (e.clientX-rect.left)/rect.width;
  audio.currentTime = pct * audio.duration;
};

};
