<!-- gramjs browser build dari CDN -->
<script src="https://cdn.jsdelivr.net/npm/telegram@2.26.0/browser/telegram.js"></script>

<style>
/* Layout: two-column chat app — sidebar + main */
:root {
  --bg: #f4f4f5;
  --bg-sidebar: #ffffff;
  --bg-chat: #efeae2;
  --bg-input: #ffffff;
  --fg: #1a1a1a;
  --fg-muted: #6b7280;
  --fg-time: #9ca3af;
  --accent: #2b72bc;
  --accent-fg: #ffffff;
  --bubble-out: #dcf8c6;
  --bubble-in: #ffffff;
  --bubble-out-fg: #111;
  --divider: #e5e7eb;
  --hover: #f0f0f0;
  --active: #e8f0fb;
  --unread-bg: #2b72bc;
  --header-bg: #2b72bc;
  --header-fg: #ffffff;
  --online: #31c48d;
  --input-border: #e5e7eb;
  --shadow: 0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #1c1c1e; --bg-sidebar: #252525; --bg-chat: #0e1621;
    --bg-input: #2c2c2e; --fg: #e5e7eb; --fg-muted: #9ca3af;
    --fg-time: #6b7280; --accent: #3b82f6; --bubble-out: #2b5219;
    --bubble-in: #2c2c2e; --bubble-out-fg: #e5e7eb;
    --divider: #2d2d2f; --hover: #2d2d2f; --active: #1e3a5f;
    --unread-bg: #3b82f6; --header-bg: #1c2333; --header-fg: #e5e7eb;
    --input-border: #3d3d3f; --shadow: 0 1px 3px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1c1c1e; --bg-sidebar: #252525; --bg-chat: #0e1621;
  --bg-input: #2c2c2e; --fg: #e5e7eb; --fg-muted: #9ca3af;
  --fg-time: #6b7280; --accent: #3b82f6; --bubble-out: #2b5219;
  --bubble-in: #2c2c2e; --bubble-out-fg: #e5e7eb;
  --divider: #2d2d2f; --hover: #2d2d2f; --active: #1e3a5f;
  --unread-bg: #3b82f6; --header-bg: #1c2333; --header-fg: #e5e7eb;
  --input-border: #3d3d3f; --shadow: 0 1px 3px rgba(0,0,0,.3);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'Inter', system-ui, sans-serif; font-size: 14px; overflow: hidden; }
body { background: var(--bg); color: var(--fg); }

/* ── SCREENS ── */
.screen { display: none; height: 100%; }
.screen.active { display: flex; }

/* ── AUTH ── */
#auth-screen { align-items: center; justify-content: center; background: var(--bg); }
.auth-wrap { background: var(--bg-sidebar); border-radius: 16px; padding: 40px 36px; width: min(400px, 92vw); box-shadow: 0 4px 32px rgba(0,0,0,.12); display: flex; flex-direction: column; gap: 18px; align-items: stretch; }
.auth-logo { width: 72px; height: 72px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; margin: 0 auto 4px; font-size: 34px; }
.auth-wrap h1 { text-align: center; font-size: 22px; font-weight: 600; }
.auth-wrap p { text-align: center; color: var(--fg-muted); font-size: 13px; line-height: 1.5; }
.auth-wrap input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--input-border); border-radius: 10px; background: var(--bg); color: var(--fg); font-size: 15px; font-family: inherit; outline: none; transition: border-color .15s; }
.auth-wrap input:focus { border-color: var(--accent); }
.btn-main { padding: 12px; background: var(--accent); color: var(--accent-fg); border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity .15s; font-family: inherit; }
.btn-main:hover { opacity: .88; }
.btn-main:disabled { opacity: .5; cursor: not-allowed; }
.otp-row { display: flex; gap: 8px; justify-content: center; }
.otp-row input { width: 46px; height: 54px; text-align: center; font-size: 22px; font-weight: 600; padding: 0; border: 1.5px solid var(--input-border); border-radius: 10px; background: var(--bg); color: var(--fg); font-family: inherit; outline: none; }
.otp-row input:focus { border-color: var(--accent); }
.auth-err { color: #dc2626; font-size: 12px; text-align: center; min-height: 16px; }
.auth-foot { font-size: 11px; color: var(--fg-muted); text-align: center; }

/* ── APP ── */
#app-screen { flex-direction: row; background: var(--bg); }

/* SIDEBAR */
.sidebar { width: 340px; min-width: 260px; background: var(--bg-sidebar); display: flex; flex-direction: column; border-right: 1px solid var(--divider); flex-shrink: 0; }
.s-header { background: var(--header-bg); color: var(--header-fg); padding: 0 12px; display: flex; align-items: center; gap: 8px; height: 56px; flex-shrink: 0; }
.s-header h2 { font-size: 17px; font-weight: 600; flex: 1; }
.icon-btn { background: none; border: none; color: inherit; cursor: pointer; padding: 7px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: background .12s; flex-shrink: 0; }
.icon-btn:hover { background: rgba(255,255,255,.18); }
.chat-list { flex: 1; overflow-y: auto; }
.chat-item { display: flex; align-items: center; gap: 11px; padding: 9px 12px; cursor: pointer; border-bottom: 1px solid var(--divider); transition: background .1s; }
.chat-item:hover { background: var(--hover); }
.chat-item.active { background: var(--active); }
.av { width: 50px; height: 50px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 19px; color: #fff; position: relative; }
.av.on::after { content: ''; position: absolute; bottom: 2px; right: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--online); border: 2px solid var(--bg-sidebar); }
.ci { flex: 1; min-width: 0; }
.ci-top { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; }
.ci-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ci-time { font-size: 11px; color: var(--fg-time); flex-shrink: 0; }
.ci-bot { display: flex; align-items: center; gap: 4px; margin-top: 2px; }
.ci-last { font-size: 13px; color: var(--fg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.badge { background: var(--unread-bg); color: #fff; border-radius: 10px; font-size: 11px; font-weight: 600; padding: 1px 6px; min-width: 18px; text-align: center; flex-shrink: 0; }
.loading-chats { padding: 24px; text-align: center; color: var(--fg-muted); font-size: 13px; }

/* MAIN */
.chat-main { flex: 1; display: flex; flex-direction: column; background: var(--bg-chat); min-width: 0; }
.m-header { background: var(--header-bg); color: var(--header-fg); display: flex; align-items: center; gap: 10px; padding: 0 12px; height: 56px; flex-shrink: 0; }
.m-header .av { width: 38px; height: 38px; font-size: 13px; }
.m-hinfo { flex: 1; }
.m-hname { font-weight: 600; font-size: 15px; }
.m-hstatus { font-size: 12px; opacity: .8; }
.msgs { flex: 1; overflow-y: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 1px; }
.date-sep { text-align: center; font-size: 11px; color: var(--fg-muted); background: rgba(128,128,128,.15); display: inline-block; padding: 3px 10px; border-radius: 10px; align-self: center; margin: 6px 0; }
.msg-row { display: flex; }
.msg-row.out { justify-content: flex-end; }
.msg-row.in { justify-content: flex-start; }
.bubble { max-width: 68%; padding: 6px 10px 4px; border-radius: 12px; font-size: 14px; line-height: 1.45; }
.msg-row.out .bubble { background: var(--bubble-out); color: var(--bubble-out-fg); border-bottom-right-radius: 3px; }
.msg-row.in .bubble { background: var(--bubble-in); color: var(--fg); border-bottom-left-radius: 3px; box-shadow: var(--shadow); }
.b-sender { font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 2px; }
.b-text { word-break: break-word; white-space: pre-wrap; }
.b-meta { display: flex; align-items: center; justify-content: flex-end; gap: 3px; margin-top: 2px; }
.b-time { font-size: 10px; color: var(--fg-time); }
.msg-row.out .b-time { color: rgba(0,0,0,.38); }
.tick { font-size: 11px; color: var(--accent); }
.empty-chat { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--fg-muted); }
.empty-chat svg { opacity: .25; }
.input-bar { background: var(--bg-input); border-top: 1px solid var(--divider); padding: 8px 10px; display: flex; align-items: flex-end; gap: 8px; flex-shrink: 0; }
.attach { background: none; border: none; cursor: pointer; padding: 6px; border-radius: 50%; color: var(--fg-muted); display: flex; align-items: center; justify-content: center; transition: color .1s; }
.attach:hover { color: var(--accent); }
.msg-inp { flex: 1; border: 1px solid var(--input-border); outline: none; background: var(--bg); border-radius: 20px; padding: 9px 14px; font-size: 14px; font-family: inherit; color: var(--fg); resize: none; max-height: 120px; line-height: 1.4; }
.msg-inp::placeholder { color: var(--fg-muted); }
.send { background: var(--accent); border: none; cursor: pointer; padding: 0; width: 40px; height: 40px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: opacity .12s; }
.send:hover { opacity: .88; }
.send:disabled { opacity: .5; }

/* TOAST */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 13px; z-index: 999; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }

/* MOBILE */
@media (max-width: 640px) {
  .sidebar { width: 100%; }
  .chat-main { display: none; position: absolute; inset: 0; z-index: 10; }
  .chat-main.open { display: flex; }
  .back-btn { display: flex !important; }
}
.back-btn { display: none; }
</style>

<!-- AUTH SCREEN -->
<div id="auth-screen" class="screen active">
  <div class="auth-wrap">

<div id="app-screen" class="screen">
  <div class="sidebar">
    <div class="s-header">

        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════
// TUKAR INI KE URL RAILWAY AWAK
const PROXY_URL = 'wss://your-railway-app.railway.app';
// ══════════════════════════════════════════

// Telegram API credentials — daftar di https://my.telegram.org/apps
const API_ID   = 0;       // ← ISI API_ID AWAK
const API_HASH = '';      // ← ISI API_HASH AWAK

// ── HELPERS ──
const $ = id => document.getElementById(id);
let tgClient = null;
let activeDialog = null;
let me = null;

function toast(msg, dur = 3000) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

function avatarColor(name = '') {
  const colors = ['#e74c3c','#e67e22','#27ae60','#2980b9','#8e44ad','#16a085','#c0392b','#2c3e50'];
  let h = 0;
  for (const c of name) h = (h * 31 + c.charCodeAt(0)) & 0xffffffff;
  return colors[Math.abs(h) % colors.length];
}

function fmtTime(date) {
  if (!date) return '';
  const d = date instanceof Date ? date : new Date(date * 1000);
  const now = new Date();
  if (d.toDateString() === now.toDateString()) {
    return d.toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' });
  }
  return d.toLocaleDateString('ms-MY', { day: 'numeric', month: 'short' });
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}

// ── AUTH ──
let authStep = 'phone';
let phoneCodeHash = '';

$('a-btn').addEventListener('click', async () => {
  $('a-err').textContent = '';
  $('a-btn').disabled = true;

  try {
    if (authStep === 'phone') {
      const phone = $('inp-phone').value.trim();
      if (!phone) throw new Error('Masukkan nombor telefon');

      // Init gramjs client dengan proxy
      const { TelegramClient } = telegram;
      const { StringSession } = telegram.sessions;

      tgClient = new TelegramClient(
        new StringSession(''),
        API_ID,
        API_HASH,
        {
          connectionRetries: 5,
          useWSS: true,
          // Guna proxy kita sebagai transport
          networkSocket: (dc) => {
            const ws = new WebSocket(`${PROXY_URL}?dc=${dc}`);
            return ws;
          }
        }
      );

      await tgClient.connect();
      const result = await tgClient.sendCode({ apiId: API_ID, apiHash: API_HASH }, phone);
      phoneCodeHash = result.phoneCodeHash;

      $('a-desc').textContent = `Kod dihantar ke ${phone}`;
      $('s-phone').hidden = true;
      $('s-otp').hidden = false;
      document.querySelector('.otp-d').focus();
      $('a-btn').textContent = 'Sahkan Kod';
      authStep = 'otp';

    } else if (authStep === 'otp') {
      const code = [...document.querySelectorAll('.otp-d')].map(i => i.value).join('');
      if (code.length !== 5) throw new Error('Masukkan 5 digit kod');

      const phone = $('inp-phone').value.trim();
      await tgClient.signIn({ phoneNumber: phone, phoneCodeHash, phoneCode: code });
      await afterLogin();

    } else if (authStep === '2fa') {
      const pw = $('inp-2fa').value;
      if (!pw) throw new Error('Masukkan kata laluan');
      await tgClient.signInWithPassword(
        { apiId: API_ID, apiHash: API_HASH },
        { password: pw }
      );
      await afterLogin();
    }
  } catch (err) {
    if (err.message?.includes('SESSION_PASSWORD_NEEDED')) {
      $('s-otp').hidden = true;
      $('s-2fa').hidden = false;
      $('a-desc').textContent = 'Akaun anda dilindungi 2FA';
      $('a-btn').textContent = 'Log Masuk';
      authStep = '2fa';
    } else {
      $('a-err').textContent = err.message || 'Ralat berlaku';
    }
  }
  $('a-btn').disabled = false;
});

// OTP digit auto-advance
document.querySelectorAll('.otp-d').forEach((inp, i, all) => {
  inp.addEventListener('input', () => { if (inp.value && i < all.length - 1) all[i+1].focus(); });
  inp.addEventListener('keydown', e => { if (e.key === 'Backspace' && !inp.value && i > 0) all[i-1].focus(); });
});

// ── SELEPAS LOGIN ──
async function afterLogin() {
  me = await tgClient.getMe();
  showScreen('app-screen');
  loadDialogs();
  listenUpdates();
}

// ── LOAD DIALOG LIST ──
async function loadDialogs() {
  const list = $('chat-list');
  list.innerHTML = '<div class="loading-chats">Memuatkan…</div>';
  try {
    const dialogs = await tgClient.getDialogs({ limit: 50 });
    list.innerHTML = '';
    dialogs.forEach(d => {
      const name = d.name || d.title || 'Tanpa nama';
      const color = avatarColor(name);
      const last = d.message?.message || '';
      const time = fmtTime(d.message?.date);
      const unread = d.unreadCount || 0;

      const item = document.createElement('div');
      item.className = 'chat-item';
      item.innerHTML = `
        <div class="av" style="background:${color}">${name[0]?.toUpperCase() || '?'}</div>
        <div class="ci">
          <div class="ci-top">
            <span class="ci-name">${name}</span>
            <span class="ci-time">${time}</span>
          </div>
          <div class="ci-bot">
            <span class="ci-last">${last}</span>
            ${unread ? `<span class="badge">${unread > 99 ? '99+' : unread}</span>` : ''}
          </div>
        </div>`;
      item.addEventListener('click', () => openDialog(d, item, name, color));
      list.appendChild(item);
    });
  } catch (err) {
    list.innerHTML = `<div class="loading-chats" style="color:#dc2626">${err.message}</div>`;
  }
}

// ── BUKA DIALOG ──
async function openDialog(dialog, item, name, color) {
  document.querySelectorAll('.chat-item').forEach(i => i.classList.remove('active'));
  item.classList.add('active');
  activeDialog = dialog;

  $('h-name').textContent = name;
  $('h-status').textContent = dialog.isChannel ? 'Channel' : dialog.isGroup ? 'Kumpulan' : 'Peribadi';
  $('h-av').textContent = name[0]?.toUpperCase() || '?';
  $('h-av').style.background = color;

  $('empty-state').style.display = 'none';
  $('active-chat').style.display = 'flex';

  // Mobile
  if (window.innerWidth <= 640) $('chat-main').classList.add('open');

  await loadMessages(dialog);
}

// ── LOAD MESEJ ──
async function loadMessages(dialog) {
  const area = $('msgs');
  area.innerHTML = '<div class="loading-chats">Memuatkan mesej…</div>';
  try {
    const messages = await tgClient.getMessages(dialog.entity, { limit: 50 });
    area.innerHTML = '';
    const sorted = [...messages].reverse();
    let lastDate = '';

    sorted.forEach(msg => {
      if (!msg.message && !msg.sticker) return;
      const d = new Date(msg.date * 1000);
      const dateStr = d.toLocaleDateString('ms-MY', { day: 'numeric', month: 'long', year: 'numeric' });
      if (dateStr !== lastDate) {
        const sep = document.createElement('div');
        sep.className = 'date-sep';
        sep.textContent = dateStr;
        area.appendChild(sep);
        lastDate = dateStr;
      }

      const isOut = msg.out;
      const row = document.createElement('div');
      row.className = 'msg-row ' + (isOut ? 'out' : 'in');
      const time = d.toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' });
      const ticks = isOut ? '✓✓' : '';

      row.innerHTML = `
        <div class="bubble">
          <div class="b-text">${msg.message || '📎 Media'}</div>
          <div class="b-meta">
            <span class="b-time">${time}</span>
            ${ticks ? `<span class="tick">${ticks}</span>` : ''}
          </div>
        </div>`;
      area.appendChild(row);
    });
    area.scrollTop = area.scrollHeight;
  } catch (err) {
    area.innerHTML = `<div class="loading-chats" style="color:#dc2626">${err.message}</div>`;
  }
}

// ── HANTAR MESEJ ──
$('send-btn').addEventListener('click', sendMsg);
$('msg-inp').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});
$('msg-inp').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

async function sendMsg() {
  const inp = $('msg-inp');
  const text = inp.value.trim();
  if (!text || !activeDialog || !tgClient) return;

  inp.value = '';
  inp.style.height = 'auto';

  // Tambah bubble terus (optimistic)
  const area = $('msgs');
  const now = new Date();
  const time = now.toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' });
  const row = document.createElement('div');
  row.className = 'msg-row out';
  row.innerHTML = `<div class="bubble"><div class="b-text">${text}</div><div class="b-meta"><span class="b-time">${time}</span><span class="tick">✓</span></div></div>`;
  area.appendChild(row);
  area.scrollTop = area.scrollHeight;

  try {
    await tgClient.sendMessage(activeDialog.entity, { message: text });
  } catch (err) {
    toast('Gagal hantar: ' + err.message);
  }
}

// ── REALTIME UPDATES ──
function listenUpdates() {
  if (!tgClient) return;
  tgClient.addEventHandler((event) => {
    const msg = event.message;
    if (!msg || !activeDialog) return;
    // Semak sama ada mesej untuk dialog aktif
    const chatId = msg.chatId?.toString() || msg.peerId?.toString();
    const activId = activeDialog.id?.toString();
    if (chatId !== activId) return;

    const area = $('msgs');
    const d = new Date(msg.date * 1000);
    const time = d.toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' });
    const row = document.createElement('div');
    row.className = 'msg-row ' + (msg.out ? 'out' : 'in');
    row.innerHTML = `<div class="bubble"><div class="b-text">${msg.message || '📎'}</div><div class="b-meta"><span class="b-time">${time}</span></div></div>`;
    area.appendChild(row);
    area.scrollTop = area.scrollHeight;
  }, new telegram.events.NewMessage({}));
}

// ── LOGOUT ──
$('logout-btn').addEventListener('click', async () => {
  if (!tgClient) return;
  try {
    await tgClient.invoke(new telegram.tl.functions.auth.LogOutRequest());
    await tgClient.disconnect();
    tgClient = null;
  } catch(_) {}
  showScreen('auth-screen');
  authStep = 'phone';
  $('s-phone').hidden = false;
  $('s-otp').hidden = true;
  $('s-2fa').hidden = true;
  $('a-btn').textContent = 'Seterusnya →';
  $('a-desc').textContent = 'Masukkan nombor telefon untuk log masuk';
});

// ── BACK (MOBILE) ──
$('back-btn').addEventListener('click', () => {
  $('chat-main').classList.remove('open');
  activeDialog = null;
});
</script>
